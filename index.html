<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Europa 2027</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23ffffff' d='M498.1 5.6c10.1 7 15.4 19.1 13.5 31.2l-64 416c-1.5 9.7-7.4 18.2-16 23s-18.9 5.4-28 1.6L284 427.7l-82.8 82.8c-11.2 11.2-28.5 13.4-42.1 5.3s-20.9-23.7-18.2-39.1l17.8-100.8L18 290.3c-11.5-5.5-18-17.3-17-30s9.6-22.3 21.9-24.9l448-96c10.6-2.3 21.8 1.1 29.2 8.2z'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23ffffff' d='M498.1 5.6c10.1 7 15.4 19.1 13.5 31.2l-64 416c-1.5 9.7-7.4 18.2-16 23s-18.9 5.4-28 1.6L284 427.7l-82.8 82.8c-11.2 11.2-28.5 13.4-42.1 5.3s-20.9-23.7-18.2-39.1l17.8-100.8L18 290.3c-11.5-5.5-18-17.3-17-30s9.6-22.3 21.9-24.9l448-96c10.6-2.3 21.8 1.1 29.2 8.2z'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- MODAL DE LOGIN SUPABASE -->
  <div class="modal active" id="modal-login" style="z-index: 999;">
    <div class="modal-content" style="margin:auto; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
      <div style="text-align: center; margin-bottom: 20px;">
        <i class="fa-solid fa-plane-departure" style="font-size: 2.5rem; color: #ffffff;"></i>
        <h2 style="margin-top: 10px; color: #ffffff;">Europa 2027</h2>
        <p style="font-size: 0.85rem; opacity:0.8; color: #cbd5e1;">Acesso Restrito</p>
      </div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="login-email" class="form-control" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="login-senha" class="form-control" required placeholder="******">
        </div>
        <div id="login-error" style="color: #ef4444; font-size: 0.8rem; text-align: center; margin-bottom:10px; display:none;">Credenciais inválidas.</div>
        <button type="submit" class="submit-btn" id="btn-login-submit">Entrar</button>
      </form>
    </div>
  </div>

  <header>
    <div class="brand">
      <i class="fa-solid fa-plane-departure brand-icon"></i> <span class="brand-title">Europa 2027</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="exportToXLSX()" title="Exportar Excel"><i class="fa-solid fa-file-excel" style="color: #10b981;"></i></button>
      <button class="icon-btn" onclick="logout()" title="Sair"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </div>
  </header>

  <main class="container" id="main-content" style="display:none;">
    
    <!-- ABA 1: ROTEIRO -->
    <section id="tab-roteiro" class="tab-content active">
      <div class="days-carousel" id="days-carousel-container"></div>
      <div class="city-filters" id="city-bar"></div>
      
      <div class="filter-toggles">
        <button class="toggle-btn active" id="btn-ver-tudo" onclick="setDoneFilter('ALL')">Ver Tudo</button>
        <button class="toggle-btn" id="btn-ver-falta" onclick="setDoneFilter('PENDING')">O Que Falta</button>
      </div>
      
      <div id="timeline-container"></div>
    </section>

    <!-- ABA 2: ORÇAMENTO -->
    <section id="tab-orcamento" class="tab-content">
      <div class="euro-config">
        <span class="euro-label"><i class="fa-solid fa-money-bill-transfer"></i> Euro Médio (R$):</span>
        <input type="number" step="0.01" id="euro-input" value="5.98" class="euro-field" onchange="updateEuro()">
      </div>
      <div class="metrics-grid-3">
        <div class="metric-card">
          <div class="metric-title">PROJETADO</div>
          <div class="metric-val" id="metric-proj-eur">€ 0,00</div>
          <div class="metric-sub" id="metric-proj-brl">R$ 0,00</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">EFETIVADO</div>
          <div class="metric-val" id="metric-efet-eur" style="color: #059669;">€ 0,00</div>
          <div class="metric-sub" id="metric-efet-brl">R$ 0,00</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">A PAGAR</div>
          <div class="metric-val" id="metric-dif-eur" style="color: #d97706;">€ 0,00</div>
          <div class="metric-sub" id="metric-dif-brl">R$ 0,00</div>
        </div>
      </div>
      <div id="orcamento-list" class="list-container"></div>
    </section>

    <!-- ABA 3: GASTOS -->
    <section id="tab-gastos" class="tab-content">
      <div class="section-title"><i class="fa-solid fa-receipt"></i> Lançamento de Gastos Reais</div>
      <div id="gastos-list" class="list-container"></div>
    </section>
  </main>

  <button class="fab" id="fab-btn" onclick="openContextModal()" style="display:none;"><i class="fa-solid fa-plus"></i></button>

  <!-- MODAL: ROTEIRO -->
  <div class="modal" id="modal-roteiro">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Atração</div>
        <button class="close-btn" onclick="closeModal('modal-roteiro')">&times;</button>
      </div>
      <form id="form-roteiro" onsubmit="handleRoteiroSubmit(event)">
        <input type="hidden" id="rot-id">
        <div class="form-group"><label>Dia</label><select id="rot-dia" class="form-control" required></select></div>
        <div class="form-group"><label>Cidade</label><select id="rot-cidade" class="form-control" required></select></div>
        <div class="form-group"><label>Categoria</label>
          <select id="rot-categoria" class="form-control">
            <option value="DESTAQUE">DESTAQUE</option>
            <option value="ESTAÇÃO">ESTAÇÃO</option>
            <option value="HOTEL">HOTEL</option>
            <option value="LOJA">LOJA</option>
            <option value="MUSEU">MUSEU</option>
            <option value="PARQUE">PARQUE</option>
            <option value="RESTAURANTE">RESTAURANTE</option>
            <option value="OUTRO">OUTRO</option>
          </select>
        </div>
        <div class="form-group"><label>Atração</label><input type="text" id="rot-atracao" class="form-control" required></div>
        <div class="form-group"><label>Região</label><input type="text" id="rot-regiao" class="form-control"></div>
        <div class="form-group"><label>Horário</label><input type="text" id="rot-horario" class="form-control"></div>
        <div class="form-group"><label>Endereço</label><input type="text" id="rot-endereco" class="form-control"></div>
        <div class="form-group"><label>Custo (€)</label><input type="number" step="0.01" id="rot-custo" class="form-control"></div>
        <div class="form-group"><label>Link Maps</label><input type="url" id="rot-link" class="form-control"></div>
        <div class="form-group"><label>Observações</label><input type="text" id="rot-obs" class="form-control"></div>
        <button type="submit" class="submit-btn">Salvar</button>
      </form>
    </div>
  </div>

  <!-- MODAL: ORÇAMENTO -->
  <div class="modal" id="modal-orcamento">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Item de Orçamento</div>
        <button class="close-btn" onclick="closeModal('modal-orcamento')">&times;</button>
      </div>
      <form id="form-orcamento" onsubmit="handleOrcamentoSubmit(event)">
        <input type="hidden" id="orc-id">
        <div class="form-group"><label>Categoria</label>
          <select id="orc-cat" class="form-control" required></select>
        </div>
        <div class="form-group"><label>Item / Descrição</label><input type="text" id="orc-item" class="form-control" required></div>
        <div class="form-group"><label>Status</label>
          <select id="orc-status" class="form-control">
            <option value="PAGO">PAGO</option>
            <option value="A PAGAR">A PAGAR</option>
            <option value="PROJETADO">PROJETADO</option>
          </select>
        </div>
        <div class="form-group"><label>Moeda do Valor Digitado</label>
          <select id="orc-moeda" class="form-control">
            <option value="EUR">Euros (€)</option>
            <option value="BRL">Reais (R$)</option>
          </select>
        </div>
        <div class="form-group"><label>Valor Digitado</label><input type="number" step="0.01" id="orc-proj" class="form-control" required></div>
        <button type="submit" class="submit-btn">Salvar</button>
      </form>
    </div>
  </div>

  <!-- MODAL: GASTOS -->
  <div class="modal" id="modal-gastos">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Lançar Gasto Efetivado</div>
        <button class="close-btn" onclick="closeModal('modal-gastos')">&times;</button>
      </div>
      <form id="form-gastos" onsubmit="handleGastosSubmit(event)">
        <input type="hidden" id="gas-id">
        <div class="form-group"><label>Data do Gasto</label><input type="date" id="gas-data" class="form-control" required></div>
        <div class="form-group"><label>Cidade</label><select id="gas-cidade" class="form-control" required></select></div>
        <div class="form-group"><label>Categoria</label>
          <select id="gas-cat" class="form-control" required></select>
        </div>
        <div class="form-group"><label>Descrição do Item</label><input type="text" id="gas-item" class="form-control" required></div>
        <div class="form-group"><label>Moeda Paga</label>
          <select id="gas-moeda" class="form-control">
            <option value="EUR">Euros (€)</option>
            <option value="BRL">Reais (R$)</option>
          </select>
        </div>
        <div class="form-group"><label>Valor Gasto</label><input type="number" step="0.01" id="gas-valor" class="form-control" required></div>
        <button type="submit" class="submit-btn">Lançar</button>
      </form>
    </div>
  </div>

  <nav class="bottom-nav" id="bottom-nav" style="display:none;">
    <button class="nav-item active" onclick="switchTab('roteiro', this)"><i class="fa-regular fa-calendar-days nav-icon"></i><span>Roteiro</span></button>
    <button class="nav-item" onclick="switchTab('orcamento', this)"><i class="fa-solid fa-wallet nav-icon"></i><span>Orçamento</span></button>
    <button class="nav-item" onclick="switchTab('gastos', this)"><i class="fa-solid fa-receipt nav-icon"></i><span>Gastos</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
