<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Europa 2027</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="styles.css?v=8.0">
</head>
<body>

  <div class="modal active" id="modal-login" style="z-index: 999;">
    <div class="modal-content" style="margin:auto; border-radius: 20px;">
      <div style="text-align: center; margin-bottom: 20px;">
        <i class="fa-solid fa-plane-departure" style="font-size: 2.5rem; color: #2563eb;"></i>
        <h2 style="margin-top: 10px; color: #ffffff;">Europa 2027</h2>
        <p style="font-size: 0.85rem; color: #cbd5e1;">Acesso Restrito</p>
      </div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="login-email" class="form-control" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="login-senha" class="form-control" required placeholder="******">
        </div>
        <div id="login-error" style="color: #ef4444; font-size: 0.8rem; text-align: center; margin-bottom:10px; display:none;">Credenciais inválidas.</div>
        <button type="submit" class="submit-btn" id="btn-login-submit">Entrar</button>
      </form>
    </div>
  </div>

  <header>
    <div class="brand">
      <i class="fa-solid fa-plane-departure brand-icon" style="color: #ffffff;"></i> <span class="brand-title">Europa 2027</span>
    </div>
    <div class="header-actions">
      <input type="file" id="import-file-input" accept=".xlsx,.xls" style="display:none;" onchange="handleImportFile(event)">
      <button class="icon-btn" onclick="document.getElementById('import-file-input').click()" title="Importar Excel"><i class="fa-solid fa-file-import" style="color: #2563eb;"></i></button>
      <button class="icon-btn" onclick="exportToXLSX()" title="Exportar Excel"><i class="fa-solid fa-file-excel" style="color: #10b981;"></i></button>
      <button class="icon-btn" onclick="logout()" title="Sair"><i class="fa-solid fa-arrow-right-from-bracket" style="color: #f8fafc;"></i></button>
    </div>
  </header>

  <main class="container" id="main-content" style="display:none;">
    
    <section id="tab-roteiro" class="tab-content active">
      <div class="days-carousel" id="days-carousel-container"></div>
      <div class="city-filters" id="city-bar"></div>
      
      <div class="filter-toggles">
        <button class="toggle-btn active" id="btn-ver-tudo" onclick="setDoneFilter('ALL')">Ver Tudo</button>
        <button class="toggle-btn" id="btn-ver-falta" onclick="setDoneFilter('PENDING')">O Que Falta</button>
      </div>
      
      <div id="timeline-container"></div>
    </section>

    <section id="tab-calendario" class="tab-content">
      <div class="framed-section" style="margin-bottom: 16px;">
        <div class="framed-title" style="display:flex; justify-content:space-between; align-items:center;">
          <span>VISÃO GERAL • MAIO / 2027</span>
          <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600;"><i class="fa-solid fa-plane"></i> Cidades & Migrações</span>
        </div>
        <div id="calendar-grid-container" class="calendar-grid"></div>
      </div>
    </section>

    <section id="tab-orcamento" class="tab-content">
      <div class="euro-config">
        <span class="euro-label"><i class="fa-solid fa-money-bill-transfer"></i> Euro Médio (R$):</span>
        <input type="number" step="0.01" id="euro-input" value="5.98" class="euro-field" onchange="updateEuro('euro-input')">
      </div>
      <div class="metrics-grid-3">
        <div class="metric-card">
          <div class="metric-title">PROJETADO</div>
          <div class="metric-val" id="metric-proj-eur">€ 0,00</div>
          <div class="metric-sub" id="metric-proj-brl">R$ 0,00</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">EFETIVADO</div>
          <div class="metric-val" id="metric-efet-eur" style="color: #059669;">€ 0,00</div>
          <div class="metric-sub" id="metric-efet-brl">R$ 0,00</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">A PAGAR</div>
          <div class="metric-val" id="metric-dif-eur" style="color: #d97706;">€ 0,00</div>
          <div class="metric-sub" id="metric-dif-brl">R$ 0,00</div>
        </div>
      </div>
      
      <div id="orcamento-subtotais-container"></div>

      <div class="city-filters" id="orc-city-bar"></div>
      <div id="orc-city-total"></div>

      <div class="framed-section">
        <div class="framed-title">ITENS DE ORÇAMENTO</div>
        <div id="orcamento-list" class="list-container"></div>
      </div>
    </section>

    <section id="tab-gastos" class="tab-content">
      <div class="euro-config">
        <span class="euro-label"><i class="fa-solid fa-money-bill-transfer"></i> Euro Médio (R$):</span>
        <input type="number" step="0.01" id="euro-input-gastos" value="5.98" class="euro-field" onchange="updateEuro('euro-input-gastos')">
      </div>
      <div class="metric-card" style="margin-bottom:16px;">
        <div class="metric-title">TOTAL GASTO</div>
        <div class="metric-val" id="metric-gastos-total-eur" style="color:#059669; font-size:1.3rem;">€ 0,00</div>
        <div class="metric-sub" id="metric-gastos-total-brl">R$ 0,00</div>
      </div>

      <div id="gastos-subtotais-container"></div>

      <div class="city-filters" id="gas-cat-bar"></div>

      <div class="framed-section">
        <div class="framed-title">LANÇAMENTO DE GASTOS REAIS</div>
        <div id="gastos-list" class="list-container"></div>
      </div>
    </section>
  </main>

  <button class="fab" id="fab-btn" onclick="openContextModal()" style="display:none;"><i class="fa-solid fa-plus"></i></button>

  <nav class="bottom-nav" id="bottom-nav" style="display:none;">
    <button class="nav-item active" onclick="switchTab('roteiro', this)"><i class="fa-regular fa-list-check nav-icon"></i><span>Roteiro</span></button>
    <button class="nav-item" onclick="switchTab('calendario', this)"><i class="fa-regular fa-calendar-days nav-icon"></i><span>Calendário</span></button>
    <button class="nav-item" onclick="switchTab('orcamento', this)"><i class="fa-solid fa-wallet nav-icon"></i><span>Orçamento</span></button>
    <button class="nav-item" onclick="switchTab('gastos', this)"><i class="fa-solid fa-receipt nav-icon"></i><span>Gastos</span></button>
  </nav>

  <script src="app.js?v=8.0"></script>
</body>
</html>
