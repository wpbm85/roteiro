<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Europa 2027</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome para Ícones Clipart / Line Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Libraries: SheetJS (Excel) + SortableJS (Drag & Drop) + Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Topbar Header -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-plane-departure"></i>
      <span>Europa 2027</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="exportToXLSX()" title="Exportar XLSX">
        <i class="fa-solid fa-file-excel"></i>
      </button>
      <button class="icon-btn" id="login-btn" onclick="toggleAuth()" title="Login">
        <i class="fa-solid fa-user-lock"></i>
      </button>
    </div>
  </header>

  <main class="container">
    
    <!-- Filtros de Cidade -->
    <div class="city-filters" id="city-bar">
      <button class="chip active" onclick="filterCity('TODAS', this)">Todas</button>
      <button class="chip" onclick="filterCity('AMSTERDAM', this)">Amsterdam</button>
      <button class="chip" onclick="filterCity('BRUXELAS', this)">Bruxelas</button>
      <button class="chip" onclick="filterCity('PARIS', this)">Paris</button>
      <button class="chip" onclick="filterCity('ROTERDAM', this)">Rotterdam</button>
    </div>

    <!-- Seção Roteiro (Timeline por Dias) -->
    <section id="tab-roteiro" class="tab-content active">
      <div id="timeline-container">
        <!-- Renderizado dinamicamente via JS agrupado por dias -->
      </div>
    </section>

    <!-- Seção Orçamento -->
    <section id="tab-orcamento" class="tab-content">
      <div class="section-title">📊 Resumo do Orçamento</div>
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-title">Projetado Total</div>
          <div class="metric-val" id="metric-proj">€ 0,00</div>
          <div class="metric-sub" id="metric-proj-brl">R$ 0,00</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Efetivado / Pago</div>
          <div class="metric-val" id="metric-efet" style="color: #059669;">€ 0,00</div>
          <div class="metric-sub" id="metric-efet-brl">R$ 0,00</div>
        </div>
      </div>
      <div id="orcamento-list"></div>
    </section>

    <!-- Seção Gastos Diários -->
    <section id="tab-gastos" class="tab-content">
      <div class="section-title">☕ Lançamentos de Gastos</div>
      <div id="gastos-list"></div>
    </section>

  </main>

  <!-- Botão Flutuante + -->
  <button class="fab" onclick="openModal()"><i class="fa-solid fa-plus"></i></button>

  <!-- Modal Adicionar Atração -->
  <div class="modal" id="add-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Nova Atração / Item</div>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <form id="add-form" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <label>Data</label>
          <input type="date" class="form-control" id="form-data" required value="2027-05-10">
        </div>
        <div class="form-group">
          <label>Cidade</label>
          <select class="form-control" id="form-cidade" required>
            <option value="AMSTERDAM">Amsterdam</option>
            <option value="BRUXELAS">Bruxelas</option>
            <option value="PARIS">Paris</option>
            <option value="ROTERDAM">Rotterdam</option>
          </select>
        </div>
        <div class="form-group">
          <label>Atração / Local</label>
          <input type="text" class="form-control" id="form-atracao" placeholder="Ex: Rijksmuseum" required>
        </div>
        <div class="form-group">
          <label>Categoria</label>
          <select class="form-control" id="form-categoria">
            <option value="MUSEU">Museu</option>
            <option value="RESTAURANTE">Restaurante</option>
            <option value="HOTEL">Hotel</option>
            <option value="TREM">Trem / Deslocamento</option>
            <option value="MARCO">Marco Turístico</option>
            <option value="OUTRO">Outro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Horário</label>
          <input type="text" class="form-control" id="form-horario" placeholder="Ex: 10h-12h">
        </div>
        <div class="form-group">
          <label>Endereço / Região</label>
          <input type="text" class="form-control" id="form-endereco" placeholder="Ex: Museumplein 6">
        </div>
        <div class="form-group">
          <label>Custo (€)</label>
          <input type="number" step="0.01" class="form-control" id="form-custo" placeholder="0.00">
        </div>
        <div class="form-group">
          <label>Observação / Dica</label>
          <input type="text" class="form-control" id="form-obs" placeholder="Ex: Comprar ingresso antecipado">
        </div>
        <div class="form-group">
          <label>Link Google Maps</label>
          <input type="url" class="form-control" id="form-link" placeholder="https://maps.app.goo.gl/...">
        </div>
        <button type="submit" class="submit-btn">Salvar Atração</button>
      </form>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('roteiro', this)">
      <i class="fa-regular fa-calendar-days nav-icon"></i>
      <span>Roteiro</span>
    </button>
    <button class="nav-item" onclick="switchTab('orcamento', this)">
      <i class="fa-solid fa-wallet nav-icon"></i>
      <span>Orçamento</span>
    </button>
    <button class="nav-item" onclick="switchTab('gastos', this)">
      <i class="fa-solid fa-receipt nav-icon"></i>
      <span>Gastos</span>
    </button>
  </nav>

  <script src="app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registrado com sucesso!'))
        .catch(err => console.log('Falha ao registrar Service Worker:', err));
    });
  }
</script>

</body>
</html>
