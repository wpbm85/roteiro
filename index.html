<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Europa 2027</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="brand">
      <i class="fa-solid fa-plane-departure"></i>
      <span>Europa 2027</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="exportToXLSX()" title="Exportar XLSX"><i class="fa-solid fa-file-excel"></i></button>
      <button class="icon-btn" id="login-btn" onclick="toggleAuth()" title="Login"><i class="fa-solid fa-user-lock"></i></button>
    </div>
  </header>

  <main class="container">
    
    <!-- ABA 1: ROTEIRO -->
    <section id="tab-roteiro" class="tab-content active">
      <div class="days-carousel" id="days-carousel-container"></div>
      <div class="city-filters" id="city-bar"></div>
      <div id="timeline-container"></div>
    </section>

    <!-- ABA 2: ORÇAMENTO -->
    <section id="tab-orcamento" class="tab-content">
      <div class="euro-config">
        <span><i class="fa-solid fa-money-bill-transfer"></i> Euro Médio (R$):</span>
        <input type="number" step="0.01" id="euro-input" value="5.98" onchange="updateEuro()">
      </div>
      
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-title">Projetado Total</div>
          <div class="metric-val" id="metric-proj-eur">€ 0,00</div>
          <div class="metric-sub" id="metric-proj-brl">R$ 0,00</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Efetivado / Pago</div>
          <div class="metric-val" id="metric-efet-eur" style="color: #059669;">€ 0,00</div>
          <div class="metric-sub" id="metric-efet-brl">R$ 0,00</div>
        </div>
      </div>
      <div id="orcamento-list" class="list-container"></div>
    </section>

    <!-- ABA 3: GASTOS DIÁRIOS -->
    <section id="tab-gastos" class="tab-content">
      <div class="section-title"><i class="fa-solid fa-receipt"></i> Lançamento de Gastos (Na Viagem)</div>
      <div id="gastos-list" class="list-container"></div>
    </section>

  </main>

  <!-- Botão Flutuante Dinâmico -->
  <button class="fab" onclick="openContextModal()"><i class="fa-solid fa-plus"></i></button>

  <!-- MODAL: ROTEIRO -->
  <div class="modal" id="modal-roteiro">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Nova Atração</div>
        <button class="close-btn" onclick="closeModal('modal-roteiro')">&times;</button>
      </div>
      <form onsubmit="handleRoteiroSubmit(event)">
        <div class="form-group"><label>Dia (Ex: 10/05 seg)</label><input type="text" id="rot-dia" class="form-control" required></div>
        <div class="form-group"><label>Cidade</label><input type="text" id="rot-cidade" class="form-control" required></div>
        <div class="form-group"><label>Atração</label><input type="text" id="rot-atracao" class="form-control" required></div>
        <div class="form-group"><label>Categoria</label><input type="text" id="rot-categoria" class="form-control"></div>
        <div class="form-group"><label>Custo (€)</label><input type="number" step="0.01" id="rot-custo" class="form-control"></div>
        <button type="submit" class="submit-btn">Salvar</button>
      </form>
    </div>
  </div>

  <!-- MODAL: ORÇAMENTO -->
  <div class="modal" id="modal-orcamento">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Novo Item de Orçamento</div>
        <button class="close-btn" onclick="closeModal('modal-orcamento')">&times;</button>
      </div>
      <form onsubmit="handleOrcamentoSubmit(event)">
        <div class="form-group"><label>Categoria (Ex: VOO, HOTEL)</label><input type="text" id="orc-cat" class="form-control" required></div>
        <div class="form-group"><label>Item / Descrição</label><input type="text" id="orc-item" class="form-control" required></div>
        <div class="form-group"><label>Projetado (€)</label><input type="number" step="0.01" id="orc-proj" class="form-control"></div>
        <div class="form-group"><label>Efetivado (€)</label><input type="number" step="0.01" id="orc-efet" class="form-control"></div>
        <div class="form-group"><label>Status (PROJETADO / PAGO)</label><input type="text" id="orc-status" class="form-control" value="PROJETADO"></div>
        <button type="submit" class="submit-btn">Salvar</button>
      </form>
    </div>
  </div>

  <!-- MODAL: GASTOS -->
  <div class="modal" id="modal-gastos">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Lançar Gasto</div>
        <button class="close-btn" onclick="closeModal('modal-gastos')">&times;</button>
      </div>
      <form onsubmit="handleGastosSubmit(event)">
        <div class="form-group"><label>Data</label><input type="text" id="gas-data" class="form-control" required></div>
        <div class="form-group"><label>Cidade</label><input type="text" id="gas-cidade" class="form-control" required></div>
        <div class="form-group"><label>Descrição do Gasto</label><input type="text" id="gas-desc" class="form-control" required></div>
        <div class="form-group"><label>Valor (€)</label><input type="number" step="0.01" id="gas-valor" class="form-control" required></div>
        <button type="submit" class="submit-btn">Lançar</button>
      </form>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('roteiro', this)"><i class="fa-regular fa-calendar-days nav-icon"></i><span>Roteiro</span></button>
    <button class="nav-item" onclick="switchTab('orcamento', this)"><i class="fa-solid fa-wallet nav-icon"></i><span>Orçamento</span></button>
    <button class="nav-item" onclick="switchTab('gastos', this)"><i class="fa-solid fa-receipt nav-icon"></i><span>Gastos</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
